gaps:
  - >-
    /.well-known/security.txt (RFC 9116) is absent even though a Vulnerability Disclosure Program and a
    Bugcrowd bounty exist at https://www.traveloka.com/en-id/vulnerability-disclosure-program.
  - >-
    The LOKA API documents an OAuth 2.0 client-credentials flow but publishes no
    /.well-known/oauth-authorization-server metadata document, so the token endpoint cannot be
    machine-discovered.
  - >-
    No /.well-known/api-catalog (RFC 9727) linking the three partner API programs, which are currently
    discoverable only across three unrelated hostnames.

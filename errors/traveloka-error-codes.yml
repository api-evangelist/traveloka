    data: object|null
    error:
      code: string
      message: string
      requestId: string
  content_type: application/json
  notes: 'Every non-2xx LOKA response returns data: null plus an error object. error.requestId is the correlation
    id Traveloka support asks for. Derived from the components.schemas Error400/401/404/408/429/500 and ErrorCode422*
    definitions in the published OpenAPI.'

summary: Published error-code registry for the Traveloka Partners Network (LOKA) v2 Accommodation API. Codes are
  namespaced AFI<n> and are returned inside the error envelope as error.code alongside error.message and a per-call
  error.requestId. Captured verbatim from the provider's public 'Error Codes & FAQ' reference; nothing here is inferred.
format: proprietary
rfc9457: false
envelope:

  error_codes: errors/traveloka-error-codes.yml
  rate_limits: rate-limits/traveloka-rate-limits.yml
  lifecycle: lifecycle/traveloka-lifecycle.yml
  sandbox: sandbox/traveloka-sandbox.yml

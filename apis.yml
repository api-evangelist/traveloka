- name: Traveloka Connect - Connectivity API
  description: >-
    OpenTravel (OTA) 2017B XML connectivity API for channel managers, property-management systems and
    hotel technology partners. Traveloka hosts the ARI (availability, rates, inventory) and content push
    endpoints; the partner hosts the reservation, availability-check and payment-notification callbacks.
    Message set covers OTA_PingRQ, OTA_HotelAvailRQ, OTA_HotelAvailNotifRQ, OTA_HotelRateAmountNotifRQ,
    OTA_HotelDescriptiveContentNotifRQ, OTA_HotelRatePlanNotifRQ and OTA_HotelResNotifRQ.
  humanURL: https://developer.connect.traveloka.com/
  baseURL: https://api.connect.traveloka.com/

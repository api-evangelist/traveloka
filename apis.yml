aid: traveloka
name: Traveloka
description: >-
  Traveloka (Traveloka Services Pte. Ltd.) is a Southeast Asian multi-product online travel agency
  operating across Indonesia, Thailand, Vietnam, Malaysia, Singapore, the Philippines, Australia, Japan
  and South Korea, selling flights, hotels and alternative stays, activities (Xperience), trains,
  cruises, buses, car rental and airport transfers. Its API surface is entirely partner-facing and runs
  in three distinct programs: the Traveloka Partners Network (LOKA) v2 REST API for distribution
  partners reselling Traveloka accommodation inventory; Traveloka Connect, an OpenTravel (OTA) 2017B XML
  connectivity API for channel managers and property-management systems pushing availability, rates and
  content; and Traveloka Atlas, a published JSON specification that accommodation suppliers implement on
  their own hosts so Traveloka can search and book against them. All three are approval-gated behind a
  partnership agreement and certification; none offer self-serve signup.

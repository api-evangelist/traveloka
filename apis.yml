- name: Traveloka Atlas - Traveloka Specification API
  description: >-
    Published JSON contract that accommodation suppliers implement on their own infrastructure so
    Traveloka can search and book against them - the direction of the integration is inverted, with
    Traveloka acting as the client. Ten operations across content (hotelOperation, hotelOperationV2),
    search (hotelList, roomList, bulkRoomList) and booking (book, issueCheck, issue, bookingSummary,
    cancel). HTTP Basic auth over HTTPS port 443.
  humanURL: https://atlas.traveloka.com/developers/docs/
  baseURL: https://atlas.traveloka.com/
  x-baseurl-note: >-
    Traveloka publishes no runtime base URL for this API because the SUPPLIER hosts the endpoints. The
    published spec ships a generated http://localhost:8080 server placeholder; the value recorded here is
    the Atlas product host, not a callable API root.
  tags:

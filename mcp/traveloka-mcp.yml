- rest: POST /oauth/accesstoken
  reason: Credential minting. A tool must never expose client_secret exchange to a model; the server holds
    the credential and refreshes it out of band.
blockers:
- Access is approval-gated. There is no self-serve credential, so a public MCP server could not be used
  by anyone outside a signed partnership.
- The commercial Look-to-Book ratio penalizes searches that do not convert. Agent-driven exploratory search
  is exactly the traffic shape that trips it, so any MCP surface would need LTB-aware caching built in
  rather than bolted on.

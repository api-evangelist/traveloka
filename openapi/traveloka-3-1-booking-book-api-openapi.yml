components:
  schemas:
    HotelBookingRoomSpecRequest:
      required:
      - availabilityToken
      - breakfastIncluded
      - providerHotelRoomId
      - refundable
      - wifiIncluded
      type: object
      properties:
        providerHotelRoomId:
          type: string
          description: The unique identifier for the hotel room in the provider's system
          example: '1234567890'
        availabilityToken:
          type: string
          description: The token used to check availability for the hotel room
          example: availability-token-12345
        promoIds:
          type: array
          description: List of promo IDs applicable to the booking room
          example:
          - promo123
          - promo456
          items:
            type: string
            description: List of promo IDs applicable to the booking room
            example: '["promo123","promo456"]'
        promoDescription:
          type: string
          description: Description of the promo applied to the booking room
          example: 10% off for early booking
        guestInfo:
          allOf:
          - $ref: '#/components/schemas/HotelGuestInfo'
          - description: Guest information for the booking room
        guests:
          type: array
          description: List of guests for the booking room
          items:
            $ref: '#/components/schemas/HotelBookingGuest'
        numAdults:
          type: integer
          description: Number of adults for the booking room
          format: int32
          example: 2
        numChildren:
          type: integer
          description: Number of children for the booking room
          format: int32
          example: 1
        refundable:
          type: boolean
          description: Indicate yes if this room type is refundable upon cancellation.
          example: true
        cancellationPolicy:
          allOf:
          - $ref: '#/components/schemas/HotelCancellationPolicy'
          - description: Cancellation policy for this room type. Mandatory if refundable is true. Expected behavior is that all rooms have the same cancellation policy
        noShowPolicy:
          allOf:
          - $ref: '#/components/schemas/PayAtPropertyNoShowPolicy'
          - description: '  This is mandatory for rateType = PAY_AT_PROPERTY. This will be the charge to Customer in case of no show for PAY_AT_PROPERTY.

              '
        breakfastIncluded:
          type: boolean
          description: Identifier is breakfast included in this room booking.
          example: true
          deprecated: true
        mealPlan:
          allOf:
          - $ref: '#/components/schemas/MealPlan'
          - description: Meal plan for this room booking.
        wifiIncluded:
          type: boolean
          description: Identifier is wifi included in this room booking.
          example: true
        sellingRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRateRequest'
          - description: Price for this room type in currency provided by the request
        sellingRateInfo:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRateInfo'
          - description: Selling rate info
        additionalFees:
          allOf:
          - $ref: '#/components/schemas/AdditionalFees'
          - description: The fees collected by the property. The values for each type of fee are the total for that type.
    HotelGuestInfo:
      required:
      - numAdults
      - numChildren
      type: object
      properties:
        numAdults:
          type: integer
          description: Number of adults (total adults per booking, not total adult per room)
          format: int32
          example: 2
        numChildren:
          type: integer
          description: Number of children (per booking, not per room)
          format: int32
          example: 1
        childrenAges:
          type: array
          description: Mandatory if numChildren > 0
          example:
          - 5
          - 8
          items:
            type: integer
            description: Mandatory if numChildren > 0
            format: int32
      description: Guest information for this booking
    HotelCancellationPolicy:
      type: object
      properties:
        cancellationPolicyDescription:
          type: string
          description: Description for cancellation policy
        providerCancellationPolicyInfoList:
          type: array
          description: List of cancellation policy information
          items:
            $ref: '#/components/schemas/HotelCancellationPolicyInfo'
    BookingContact:
      required:
      - email
      type: object
      properties:
        personTitle:
          type: string
          description: Title of the person making the booking. This is optional, but if provided, it should be one of the values defined in AdultPassengerTitle enum.
          example: MR
          enum:
          - MR
          - MRS
          - MISS
          - OTHERS
        firstName:
          type: string
          description: First name of the person making the booking.
          example: John
        lastName:
          type: string
          description: Last name of the person making the booking.
          example: Doe
        phone:
          type: array
          description: List of phone numbers of the person making the booking. This is optional, but if provided, it should contain at least one phone number.
          example:
          - '+6281234567890'
          - '+6289876543210'
          items:
            type: string
            description: List of phone numbers of the person making the booking. This is optional, but if provided, it should contain at least one phone number.
            example: '["+6281234567890","+6289876543210"]'
        email:
          type: string
          description: Email address of the person making the booking. This is optional, but if provided, it should be a valid email format.
          example: person@traveloka.com
    HotelBookingSpecResponse:
      required:
      - checkInDate
      - checkOutDate
      - contact
      - numAdults
      - numChildren
      - numRooms
      - providerHotelId
      - rateType
      - roomSpecs
      - totalSearchRate
      type: object
      properties:
        numRooms:
          type: integer
          description: Number of rooms
          format: int32
          example: 2
        numAdults:
          type: integer
          description: Number of adults (total adults per booking, not total adult per room)
          format: int32
          example: 2
        numChildren:
          type: integer
          description: Number of children (total children per booking, not total children per room)
          format: int32
          example: 1
        childrenAges:
          type: array
          description: Mandatory if numChildren > 0
          example:
          - 5
          items:
            type: integer
            description: Mandatory if numChildren > 0
            format: int32
        checkInDate:
          type: string
          description: Check-in date. The format to be used must be YYYY-MM-DD
          example: '2023-10-01'
        checkOutDate:
          type: string
          description: Check-out date. The format to be used must be YYYY-MM-DD
          example: '2023-10-02'
        contact:
          allOf:
          - $ref: '#/components/schemas/BookingContact'
          - description: 'In the contact node, the following information must be included: email.'
        guests:
          type: array
          description: 'In the guest node, the following information must be included: name, isAdult.'
          items:
            $ref: '#/components/schemas/HotelBookingGuest'
        specialRequest:
          type: string
          description: Special request
          example: Late check-in
        hotelRatePlanType:
          type: string
          description: Rate plan type
          enum:
          - RETAIL
          - MOBILE
          - PRIVATESALE
          - LAST_MINUTE
          - BUDGET_ROOMS
          - PACKAGE
          - CAMPAIGN
          - CROSS_SELL
          - CORPORATE
          - STATIC
          - GROWTH_MARKET
        providerHotelId:
          type: string
          description: Hotel Id
          example: '123123123'
        totalSearchRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRate'
          - description: Original rate for this room type in currency provided by the request
        locale:
          type: string
          description: Locale for the booking
          example: en_ID
        roomSpecs:
          type: array
          description: Room specification
          items:
            $ref: '#/components/schemas/HotelBookingRoomSpecResponse'
        rateType:
          type: string
          description: Rate type
          enum:
          - PAY_NOW
          - PAY_AT_PROPERTY
    HotelBookingRoomSpecResponse:
      required:
      - availabilityToken
      - providerHotelRoomId
      - refundable
      - sellingRate
      - wifiIncluded
      type: object
      properties:
        providerHotelRoomId:
          type: string
          description: Provider hotel room ID
          example: '1234567890'
        availabilityToken:
          type: string
          description: "  Token/ID for this room type/price. This is passed from room list search request.\n  Availability token does not depend on the number of rooms\n"
          example: ROOM12345
        refundable:
          type: boolean
          description: Indicate yes if this room type is refundable upon cancellation.
          example: true
        cancellationPolicy:
          allOf:
          - $ref: '#/components/schemas/HotelCancellationPolicy'
          - description: "  Mandatory if refundable is true.\n  Expected behavior all rooms have the same cancellation policy.\n"
        noShowPolicy:
          allOf:
          - $ref: '#/components/schemas/PayAtPropertyNoShowPolicy'
          - description: '  This is mandatory for rateType = PAY_AT_PROPERTY. This will be the charge to Customer in case of no show for PAY_AT_PROPERTY.

              '
        breakfastIncluded:
          type: boolean
          description: Identifier is breakfast included in this room booking.
          example: true
          deprecated: true
        mealPlan:
          allOf:
          - $ref: '#/components/schemas/MealPlan'
          - description: Meal plan for this room booking.
        wifiIncluded:
          type: boolean
          description: Identifier is wifi included in this room booking.
        ccGuaranteeRequirement:
          allOf:
          - $ref: '#/components/schemas/HotelRoomCCGuaranteeRequirementInfo'
          - description: Credit card guarantee requirement
        sellingRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRate'
          - description: Price for this room type in currency provided by the request
        sellingRateInfo:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRateInfo'
          - description: Selling rate info
        additionalFees:
          allOf:
          - $ref: '#/components/schemas/AdditionalFees'
          - description: The fees collected by the property. The values for each type of fee are the total for that type.
        promoIds:
          type: array
          description: Promotion id
          items:
            type: string
            description: Promotion id
        promoDescription:
          type: string
          description: Promotion description
    MealPlan:
      required:
      - code
      - pax
      type: object
      properties:
        code:
          type: string
          description: Mealplan codes. See FAQ - Mealplan for all available enums.
          example: RO
          enum:
          - RO
          - BF
          - LU
          - DI
          - HB
          - HB_BF_LU
          - HB_BF_DI
          - HB_LU_DI
          - FB
          - AI
        pax:
          $ref: '#/components/schemas/PiMealPlanPax'
      description: Meal plan for this room, e.g. if the booking is for 2 rooms 3 night, the mealPlan should cover for 1 room 1 night
    AdditionalFees:
      type: object
      properties:
        mandatoryFee:
          allOf:
          - $ref: '#/components/schemas/ChargeItem'
          - description: Mandatory fees are collected by the property at check-in or check-out.
        mandatoryTax:
          allOf:
          - $ref: '#/components/schemas/ChargeItem'
          - description: Mandatory taxes are collected by the property at check-in or check-out.
        resortFee:
          allOf:
          - $ref: '#/components/schemas/ChargeItem'
          - description: Resort fees are charged for amenities and extras and collected by the property at check-in or check-out.
        countryTaxFee:
          allOf:
          - $ref: '#/components/schemas/ChargeItem'
          - description: Country tax fee is collected by the property at check-in or check-out.
    HotelRoomCCGuaranteeRequirementInfo:
      required:
      - addressRequired
      - ccRequired
      - cvvRequired
      type: object
      properties:
        ccRequired:
          type: boolean
          description: Indicates if credit card information is required for guarantee
          example: true
        cvvRequired:
          type: boolean
          description: Indicates if CVV is required for the credit card
          example: true
        addressRequired:
          type: boolean
          description: Indicates if address is required for the credit card
          example: true
        csTokenRequired:
          type: boolean
          description: Indicates if a Cybersource token is required, meaning raw credit card data is not needed
          example: false
        supportedCCTypes:
          type: array
          description: List of supported credit card types
          items:
            type: string
            description: List of supported credit card types
            enum:
            - VISA
            - MASTER_CARD
            - AMERICAN_EXPRESS
            - JAPAN_CREDIT_BUREAU
            - BC_CARD
            - DISCOVER
            - MAESTRO
            - DINERS_CLUB
            - CARTA_SI
            - CARTE_BLEUE
            - VISA_ELECTRON
            - CHINA_UNION_PAY
      description: Credit card guarantee requirement for this room
    HotelFee:
      type: object
      properties:
        description:
          type: string
          description: Description of the fee
        amount:
          type: number
          description: Amount of the fee
          format: double
    BookResponse:
      required:
      - bookSpec
      - bookingToken
      - status
      type: object
      properties:
        requestId:
          type: string
          description: Unique identifier for the booking request
          example: '1234567890'
        bookingToken:
          type: string
          description: Token to identify this booking. This should be consistent between book API, issue API, and bookingSummary API for the same inventory.
          example: DHB170816104137188
        status:
          type: string
          description: "    Should be one of these:\n\n    OK -> return OK if the room is eligible, ensuring a smooth transition to the next step\n\n    FAILED -> return FAILED if there's an error during processing the request\n\n    ALREADY_BOOKED -> return ALREADY_BOOKED if the same request has been submitted multiple times, to avoid duplicate bookings\n\n    PRICE_CHANGED -> return PRICE_CHANGED if there has been a change in the room rate, whether it has increased or decreased. This will enable us to provide accurate notifications. Only use this if the provider wants to make the booking failed due to price change. If not, please return OK with the updated price\n"
          example: 23141234-0
          enum:
          - OK
          - FAILED
          - ALREADY_BOOKED
          - PRICE_CHANGED
        failureReason:
          type: string
          description: "    MANDATORY if bookRS/@status = FAILED.\n\n    Should be one of these:\n\n    NOT_AVAILABLE_ANYMORE -> e.g. one of the rooms is not available anymore\n\n    INVALID_GUEST_NAME -> guest names/email contain forbidden word\n\n    INVALID_RATEKEY -> if ratekey is unexpected\n\n    UNKNOWN -> if none of the above values is relevant\n"
          example: ROOM_NOT_AVAILABLE
          deprecated: true
          enum:
          - NOT_AVAILABLE_ANYMORE
          - INVALID_GUEST_NAME
          - INVALID_RATEKEY
          - UNKNOWN
        bookSpec:
          allOf:
          - $ref: '#/components/schemas/HotelBookingSpecResponse'
          - description: Booking Specification
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
        errors:
          type: array
          description: Mandatory if status != OK.
          deprecated: true
          items:
            $ref: '#/components/schemas/ProviderError'
    HotelRoomRate:
      required:
      - currency
      - fees
      - taxes
      - totalFare
      type: object
      properties:
        currency:
          type: string
          description: Currency code, e.g. IDR, USD
          example: IDR
        totalFare:
          type: number
          description: Total fare (including taxes, fees, and commission). If two rooms are requested in the specs, this totalFare will be for two rooms.
          format: double
          example: 1000000
        taxes:
          type: number
          description: Total taxes amount
          format: double
          example: 100000
        fees:
          type: number
          description: Total fees amount
          format: double
          example: 50000
    HotelRoomRateInfo:
      type: object
      properties:
        fees:
          type: array
          description: List of fees associated with the hotel rate
          items:
            $ref: '#/components/schemas/HotelFee'
        taxes:
          type: array
          description: List of taxes associated with the hotel rate
          items:
            $ref: '#/components/schemas/HotelFee'
        surcharges:
          type: array
          description: List of surcharges associated with the hotel rate
          items:
            $ref: '#/components/schemas/HotelFee'
    PayAtPropertyNoShowPolicy:
      type: object
      properties:
        noShowDateTime:
          type: string
          description: "  Time to considered as no show.\n  The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.\n"
          example: '1970-01-01T00:00:00.000Z'
        noShowFee:
          type: number
          description: No show fee.
          format: double
          example: 120
        currency:
          type: string
          description: Currency info
          example: USD
        nightCount:
          type: integer
          description: 'No show fee in room night.

            Example: nightCount = 1 means cancellation fee is one room night.

            This field is not mandatory if @noShowFee already filled in.

            But if @nightCount is filled in, @noShowFee MUST also be filled in.'
          format: int32
          example: 1
    ChargeItem:
      required:
      - amount
      - currency
      type: object
      properties:
        currency:
          type: string
          description: Currency of the charge item, e.g., USD, IDR
          example: USD
        amount:
          type: number
          description: Amount of the charge item
          format: double
          example: 100
    HotelCancellationPolicyInfo:
      required:
      - cancelDateTime
      - cancellationFee
      - currency
      type: object
      properties:
        cancelDateTime:
          type: string
          description: 'Date time which cancellation fee will start to take place.


            The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.


            Example:


            cancelDateTime: 2028-01-01T00:00:00.000Z


            cancellationFee: 120 (USD)


            means, cancellation after 01-Jan-2028 will impose $120 cancellation fee.

            '
          example: '2028-01-01T00:00:00.000Z'
        cancellationFee:
          type: number
          description: Cancellation fee for all rooms all nights
          format: double
          example: 120
        nightCount:
          type: integer
          description: 'Cancellation fee in room night.


            Example: nightCount = 1 means cancellation fee is one room night.


            This field is not mandatory if @cancellationFee is already filled in.


            But if @nightCount is filled in, @cancellationFee MUST also be filled in.

            '
          format: int32
        currency:
          type: string
          description: Currency of the cancellation fee
          example: USD
    HotelRoomRateRequest:
      type: object
      properties:
        currency:
          type: string
          description: Currency code, e.g. IDR, USD
          example: IDR
        totalFare:
          type: number
          description: Total fare (including taxes, fees, and commission). If two rooms are requested in the specs, this totalFare will be for two rooms.
          format: double
          example: 1000000
        taxes:
          type: number
          description: Total taxes amount
          format: double
          example: 100000
        fees:
          type: number
          description: Total fees amount
          format: double
          example: 50000
    HotelBookingGuest:
      required:
      - firstName
      type: object
      properties:
        firstName:
          type: string
          description: First name of the guest
          example: John
        lastName:
          type: string
          description: Last name of the guest
          example: Doe
        title:
          type: string
          description: Title of the guest
          enum:
          - MR
          - MRS
          - MISS
          - OTHERS
        passportNo:
          type: string
          description: Passport number of the guest
          example: A12345678
        passportCountryCode:
          type: string
          description: Country code of the passport
          example: ID
      description: 'In the guest node, the following information must be included: firstName, lastName.'
    BookRequest:
      required:
      - checkInDate
      - checkOutDate
      - contact
      - numAdults
      - numChildren
      - numRooms
      - providerHotelId
      - roomSpecs
      type: object
      properties:
        requestId:
          type: string
          description: Unique identifier for the booking request
          example: '1234567890'
        uniqueId:
          type: string
          description: The Traveloka id that is associated with this booking
          example: 23141234-0
        numRooms:
          type: integer
          description: Number of rooms
          format: int32
          example: 2
        numAdults:
          type: integer
          description: Number of adults (total adults per booking, not total adult per room)
          format: int32
          example: 2
        numChildren:
          type: integer
          description: Number of children (total children per booking, not total children per room)
          format: int32
          example: 1
        childrenAges:
          type: array
          description: Mandatory if numChildren > 0
          example:
          - 5
          items:
            type: integer
            description: Mandatory if numChildren > 0
            format: int32
        checkInDate:
          type: string
          description: Check-in date in ISO format (yyyy-MM-dd)
          example: '2023-10-01'
        checkOutDate:
          type: string
          description: Check-out date in ISO format (yyyy-MM-dd)
          example: '2023-10-02'
        contact:
          allOf:
          - $ref: '#/components/schemas/BookingContact'
          - description: 'In the contact node, the following information must be included: email.'
        guests:
          type: array
          description: 'In the guest node, the following information must be included: firstName, lastName.'
          items:
            $ref: '#/components/schemas/HotelBookingGuest'
        specialRequest:
          type: string
          description: Special request for the booking
          example: Late check-in
        hotelRatePlanType:
          type: string
          description: Rate plan type for the booking
          example: NON_REFUNDABLE
          enum:
          - RETAIL
          - MOBILE
          - PRIVATESALE
          - LAST_MINUTE
          - BUDGET_ROOMS
          - PACKAGE
          - CAMPAIGN
          - CROSS_SELL
          - CORPORATE
          - STATIC
          - GROWTH_MARKET
        providerHotelId:
          type: string
          description: Hotel id
        totalSearchRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRate'
          - description: Original rate for this room type in currency provided by the request
        locale:
          type: string
          description: Locale for the booking
          example: en_ID
        roomSpecs:
          type: array
          description: List of room specifications for the booking
          items:
            $ref: '#/components/schemas/HotelBookingRoomSpecRequest'
        rateType:
          type: string
          description: Rate type for the booking
          example: PAY_NOW
          enum:
          - PAY_NOW
          - PAY_AT_PROPERTY
    BookErrorResponse:
      required:
      - error
      - status
      type: object
      properties:
        requestId:
          type: string
          description: Unique identifier for the booking request
          example: '1234567890'
        status:
          type: string
          description: "    Should be one of these:\n\n    FAILED -> return FAILED if there's an error during processing the request\n"
          example: FAILED
          enum:
          - FAILED
        failureReason:
          type: string
          description: "    MANDATORY if bookRS/@status = FAILED.\n\n    Should be one of these:\n\n    NOT_AVAILABLE_ANYMORE -> e.g. one of the rooms is not available anymore\n\n    INVALID_GUEST_NAME -> guest names/email contain forbidden word\n\n    INVALID_RATEKEY -> if ratekey is unexpected\n\n    UNKNOWN -> if none of the above values is relevant\n"
          example: ROOM_NOT_AVAILABLE
          deprecated: true
          enum:
          - NOT_AVAILABLE_ANYMORE
          - INVALID_GUEST_NAME
          - INVALID_RATEKEY
          - UNKNOWN
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
        errors:
          type: array
          description: MANDATORY if the booking has error(s).
          deprecated: true
          items:
            $ref: '#/components/schemas/ProviderError'
    Error:
      type: object
      properties:
        errorId:
          type: string
        errorMessage:
          type: string
    PiMealPlanPax:
      required:
      - adults
      type: object
      properties:
        adults:
          type: integer
          description: "Number of adult pax. \n\nNote: Adult pax can be consumed by child guests. \n\nFor example, if the returned mealPax is 3 adults, and the guest consists of 2 adults and 1 child, it is permissible.\n"
          format: int32
          example: 2
        children:
          type: integer
          description: "Number of child pax\n\nNote: Child pax can not be consumed by adult guests. \n"
          format: int32
          example: 1
      description: Pax applicable to the mealPlan. Mandatory for all mealPlan, except Room Only.
    ProviderError:
      required:
      - errorId
      - errorMessage
      type: object
      properties:
        errorId:
          type: string
          description: "    MANDATORY if has error(s).\n    The values for errorId and the message are:\n    3017 -> BOOKING_ALREADY_ISSUED\n    3018 -> BOOKING_CANCELED\n    3006 -> BOOKING_EXPIRED\n    3016 -> FAILED_TO_CONFIRM_BOOKING\n    3003 -> INCORRECT_BOOKING_ID\n    3001 -> INCORRECT_BOOKING_INFORMATION\n    3020 -> PENDING_BOOKING\n    3000 -> UNEXPECTED_ERROR\n"
        errorSeverity:
          type: string
          description: 'Should be one of these:

            LOW, HIGH, HIGHEST

            '
          enum:
          - LOW
          - HIGH
          - HIGHEST
        errorMessage:
          type: string
          description: "    MANDATORY if has error(s).\n    The values for errorId and the message are:\n    3017 -> BOOKING_ALREADY_ISSUED\n    3018 -> BOOKING_CANCELED\n    3006 -> BOOKING_EXPIRED\n    3016 -> FAILED_TO_CONFIRM_BOOKING\n    3003 -> INCORRECT_BOOKING_ID\n    3001 -> INCORRECT_BOOKING_INFORMATION\n    3020 -> PENDING_BOOKING\n    3000 -> UNEXPECTED_ERROR\n"
        timestamp:
          type: string
          description: Timestamp of the error occurrence in unix milliseconds time format
      deprecated: true
  securitySchemes:
    basicAuth:
      type: http
      description: 'Custom Basic Auth format:

        - Format: username:password

        - Encode with Base64

        - Send in header: Authorization: Basic base64(username:password)

        '
      scheme: basic
x-tagGroups:
- name: Traveloka Atlas API (1.0)
  tags:
  - 1.1 Content - Hotel & Room
  - 2.1 Search - HotelList
  - 2.2 Search - RoomList
  - 2.3 Search - BulkRoomList
  - 3.1 Booking - Book
  - 3.2 Booking - IssueCheck
  - 3.3 Booking - Issue
  - 3.4 Booking - BookingSummary
  - 3.5 Booking - Cancel

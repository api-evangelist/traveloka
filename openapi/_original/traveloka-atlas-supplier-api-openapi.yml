      required:
      - email
      - phone
      type: object
      properties:
        phone:
          type: array
          description: List of phone numbers for the hotel
          example:
          - '+6281234567890'
          - '+6289876543210'
          items:
            type: string
            description: List of phone numbers for the hotel
            example: '["+6281234567890","+6289876543210"]'
        fax:
          type: array
          description: List of fax numbers for the hotel. If none exist, just put an empty list
          example:
          - '+6281234567890'
          items:
            type: string
            description: List of fax numbers for the hotel. If none exist, just put an empty list
            example: '["+6281234567890"]'
        email:
          type: array
          description: List of email addresses for the hotel. If none exist, just put an empty list
          example:
          - hotel@traveloka.com
          - hotel_operation@traveloka.com
          items:
            type: string
            description: List of email addresses for the hotel. If none exist, just put an empty list
            example: '["hotel@traveloka.com","hotel_operation@traveloka.com"]'
      description: Hotel's contact information
    HotelContent:
      required:
      - assets
      - attribute
      - hotel
      type: object
      properties:
        hotel:
          allOf:
          - $ref: '#/components/schemas/ProviderHotel'
          - description: Hotel information provided by the provider
        attribute:
          allOf:
          - $ref: '#/components/schemas/HotelAttribute'
          - description: 'Additional hotel attribute and instruction,

              the fields are not mandatory except hotel code,

              hotel description and hotel overview.

              Provide other details if deemed necessary.

              '
        assets:
          type: array
          description: List of hotel assets provided by the provider. Minimum 25 hotel photos, from 5 categories.
          items:
            $ref: '#/components/schemas/HotelAsset'
        rooms:
          type: array
          description: List of Hotel Rooms (Mandatory for Room Import)
          items:
            $ref: '#/components/schemas/RoomContent'

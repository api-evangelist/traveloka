            - TELEVISION_LCD_PLASMA_SCREEN
            - SATELLITE_CABLE_TV
            - JACUZZI_BATHTUB
            - OTHER
            - INTERNET
    HotelRoomInventoryResponse:
      required:
      - availabilityToken
      - commissionRate
      - currency
      - numChargedRooms
      - numRemainingRooms
      - providerOriginalRate
      - providerRecommendedSellingRate
      - rateType
      - refundable
      - wifiIncluded
      type: object
      properties:
        availabilityToken:
          type: string
          description: Token/ID for this room type/price. This availabilityToken will be used in the booking to determine
            which particular room type is being chosen.
          example: ROOM12345
        rateType:
          type: string
          description: Hotel Rate Type
          example: PAY_NOW
          enum:
          - PAY_NOW
          - PAY_AT_PROPERTY
        numRemainingRooms:
          type: integer
          description: Number of remaining rooms of this room type
          format: int32
          example: 5
        breakfastIncluded:
          type: boolean
          description: Breakfast Available for the total guest requested
          deprecated: true
        mealPlan:
          allOf:
          - $ref: '#/components/schemas/MealPlan'
          - description: Meal plan for total room
        wifiIncluded:
          type: boolean
        numExtraBedIncluded:
          type: integer
          format: int32
        currency:
          type: string
          description: Currency info
          example: IDR
        providerRecommendedSellingRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRate'
          - description: Recommended price for this room type in currency provided by the request
        providerOriginalRate:
          allOf:
          - $ref: '#/components/schemas/HotelRoomRate'
          - description: Original rate for this room type in currency provided by the request
        additionalFees:
          allOf:
          - $ref: '#/components/schemas/AdditionalFees'
          - description: The fees collected by the property. The values for each type of fee are the total for that type.
        numChargedRooms:
          type: integer
          description: Number of room being charged. If two rooms are requested in the request spec, this should return 2
            and the price will be for two rooms.
          format: int32
          example: 2
        refundable:
          type: boolean
          description: Indicate yes if this room type is refundable upon cancellation, either fully or partially refundable
        cancellationPolicy:
          allOf:
          - $ref: '#/components/schemas/HotelCancellationPolicy'
          - description: Cancellation policy for this room type. Mandatory if refundable is true. Expected behavior is that
              all rooms have the same cancellation policy.
        noShowPolicy:
          allOf:
          - $ref: '#/components/schemas/PayAtPropertyNoShowPolicy'
          - description: This is mandatory for rateType = PAY_AT_PROPERTY. This will be the charge to Customer in case of
              no show for PAY_AT_PROPERTY.
        promoIds:
          type: array
          description: Lists of promoIds applicable for this type.
          items:
            type: string
            description: Lists of promoIds applicable for this type.
        commissionRate:
          type: number
          description: Commission rate (percentage) for this room type
          format: double
          example: 15
    HotelRoomOccupancyPolicy:
      required:
      - maxOccupancy
      type: object
      properties:
        maxOccupancy:
          type: integer
          description: Return exactly the number of adults that were used in the search specification
          format: int32
          example: 2
        maxChildOccupancy:
          type: integer
          description: Return exactly the number of children that were used in the search specification
          format: int32
          example: 2
        maxInfantOccupancy:
          type: integer
          description: Return exactly the number of children that were used in the search specification
          format: int32
          example: 1
        maxExtraBeds:
          type: integer
          description: Maximum number of extra beds in the room based on user specification
          format: int32
          example: 1
      description: Room occupancy policy
    HotelRoomRate:
      required:
      - currency
      - fees
      - taxes
      - totalFare
      type: object
      properties:
        currency:
          type: string
          description: Currency code, e.g. IDR, USD
          example: IDR
        totalFare:
          type: number
          description: Total fare (including taxes, fees, and commission). If two rooms are requested in the specs, this totalFare
            will be for two rooms.
          format: double
          example: 1000000
        taxes:
          type: number
          description: Total taxes amount
          format: double
          example: 100000
        fees:
          type: number
          description: Total fees amount
          format: double
          example: 50000
    HotelRoomSize:
      required:
      - size
      - unit
      type: object
      properties:
        size:
          type: number
          description: Size of the room
          format: double
          example: 42
        isSizeIncludingTerrace:
          type: boolean
        unit:
          type: string
          description: Unit of measurement for the room size
          enum:
          - SQUARE_METER
          - SQUARE_FOOT
          - UNKNOWN
        description:
          type: string
      description: Room size
    HotelWithInventoryResponse:
      required:
      - inventories
      - room
      type: object
      properties:
        checkInInstruction:
          type: string
          description: Special check-in instruction
          example: Please check in after 13:00
        room:
          allOf:
          - $ref: '#/components/schemas/HotelRoom'
          - description: Separate the room object if they have different price due to different promotion.
        inventories:
          type: array
          description: List of room inventories for this room
          items:
            $ref: '#/components/schemas/HotelRoomInventoryResponse'
    MealPlan:
      required:
      - code
      - pax
      type: object
      properties:
        code:
          type: string
          description: Mealplan codes. See FAQ - Mealplan for all available enums.
          example: RO
          enum:
          - RO
          - BF
          - LU
          - DI
          - HB
          - HB_BF_LU
          - HB_BF_DI
          - HB_LU_DI
          - FB
          - AI
        pax:
          $ref: '#/components/schemas/PiMealPlanPax'
      description: Meal plan for this room, e.g. if the booking is for 2 rooms 3 night, the mealPlan should cover for 1 room
        1 night
    PayAtPropertyNoShowPolicy:
      type: object
      properties:
        noShowDateTime:
          type: string
          description: "  Time to considered as no show.\n  The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.\n"
          example: '1970-01-01T00:00:00.000Z'
        noShowFee:
          type: number
          description: No show fee.
          format: double
          example: 120
        currency:
          type: string
          description: Currency info
          example: USD
        nightCount:
          type: integer
          description: 'No show fee in room night.

            Example: nightCount = 1 means cancellation fee is one room night.

            This field is not mandatory if @noShowFee already filled in.

            But if @nightCount is filled in, @noShowFee MUST also be filled in.'
          format: int32
          example: 1
    PiMealPlanPax:
      required:
      - adults
      type: object
      properties:
        adults:
          type: integer
          description: "Number of adult pax. \n\nNote: Adult pax can be consumed by child guests. \n\nFor example, if the\
            \ returned mealPax is 3 adults, and the guest consists of 2 adults and 1 child, it is permissible.\n"
          format: int32
          example: 2
        children:
          type: integer
          description: "Number of child pax\n\nNote: Child pax can not be consumed by adult guests. \n"
          format: int32
          example: 1
      description: Pax applicable to the mealPlan. Mandatory for all mealPlan, except Room Only.
    RoomListSearchResponse:
      required:
      - results
      type: object
      properties:
        requestId:
          type: string
          description: Request ID for this search request
          example: 928827d7-b847-495f-9592-f207df896ac4
        results:
          type: array
          description: List of hotel rooms with inventory that match the search criteria

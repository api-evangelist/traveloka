          type: string
          description: Basic room type name from the provider. Must contain only the basic room type. Do not include bed type,
            view, amenities, cancellation policy, or breakfast information in room name.
          example: Deluxe Room
        roomDescription:
          type: string
          description: A textual description of the room. Can include amenities, features, or policies. Should not duplicate
            roomName.
        numRooms:
          type: integer
          description: Number of identical rooms available under this room type
          format: int32
          example: 5

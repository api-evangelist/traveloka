openapi: 3.0.1
info:
  title: Traveloka Atlas API
  version: ''
  description: "Traveloka Specification API for Accommodation Provider\n\n**General Notes**\n* Please ensure that the endpoint\
    \ is configured to connect using **HTTPS via port 443.**\n* For fields with type \"String\", if there's no value, do not\
    \ return empty string (e.g. \"\"), instead do not return the field at all\n\nThis API uses custom Basic Authentication.\n\
    \nHow to get a token:\n- Combine username and password using a colon: [username:password]\n- Encode that using Base64\n\
    - Example:\n  ```\n  echo -n 'user:pass' | base64\n  -> dXNlcjpwYXNz\n  ```\n\nThen use:\n```\nAuthorization: Basic dXNlcjpwYXNz\n\
    ```\n"
tags:
- name: 1.1 Content - Hotel & Room
- name: 2.1 Search - HotelList
- name: 2.2 Search - RoomList
- name: 2.3 Search - BulkRoomList
- name: 3.1 Booking - Book
- name: 3.2 Booking - IssueCheck
- name: 3.3 Booking - Issue
- name: 3.4 Booking - BookingSummary
- name: 3.5 Booking - Cancel
x-tagGroups:
- name: Traveloka Atlas API (1.0)

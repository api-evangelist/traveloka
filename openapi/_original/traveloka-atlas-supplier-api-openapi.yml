    ImportHotelDataResponse:
      required:
      - hotels
      type: object
      properties:
        from:
          type: integer
          description: Initial record number being retrieved.
          format: int32
          example: 1
        to:
          type: integer
          description: Final record number being retrieved.
          format: int32
          example: 100
        total:
          type: integer
          description: Total number of records available.
          format: int32
          example: 1000
        hotels:
          type: array
          description: List of hotel content data
          items:
            $ref: '#/components/schemas/HotelContent'
        errors:
          type: array
          description: List of errors encountered during data retrieval. Each error corresponds to a hotel that could not
            be retrieved.
          items:
            $ref: '#/components/schemas/ProviderErrorV2'
    ProviderErrorV2:
      required:
      - errorId
      type: object
      properties:
        errorStatus:
          type: string
          description: HTTP status code or provider-specific error status
          example: '404'
        errorId:
          type: string
          description: The providerPropertyId (hotel ID) that this error corresponds to
          example: H00123
        errorMessage:
          type: string
          description: Human-readable error message
          example: Hotel with ID H00123 was not found
    ProviderHotel:
      required:
      - accommodationType
      - countryISO
      - displayName
      - globalAddress
      - hotelFacility
      - hotelProperties
      - latitude
      - localAddress
      - longitude
      - name
      - providerHotelId
      - rateTypes
      - starRating
      type: object
      properties:
        providerHotelId:
          type: string
          description: Hotel Code from Provider
          example: '10000001'
        displayName:
          type: string
          description: Hotel Name to be displayed. This name is depending on locale/languages
          example: Hotel ABC
        name:
          type: string
          description: Official Hotel Name in English. This name must be consistent and NOT affected by locales/languages
          example: Hotel ABC
        formerlyName:
          type: string
          description: Old Hotel Name (if applicable)
          example: Hotel ABC
        localAddress:
          allOf:
          - $ref: '#/components/schemas/HotelAddress'
          - description: Hotel local address
        globalAddress:
          allOf:
          - $ref: '#/components/schemas/HotelAddress'
          - description: Hotel global address
        countryISO:
          type: string
          description: Hotel country ISO code
          example: ID
        hotelStyle:
          $ref: '#/components/schemas/HotelStyle'
        hotelFacility:
          allOf:
          - $ref: '#/components/schemas/HotelFacility'
          - description: Hotel facility
        hotelProperties:
          allOf:
          - $ref: '#/components/schemas/HotelProperties'
          - description: Hotel properties
        latitude:
          type: number
          description: Hotel's latitude position
          format: double
          example: 18.7123
        longitude:
          type: number
          description: Hotel's longitude position
          format: double
          example: 99.00713
        nearbyAirportCode:
          type: string
          description: Hotel's nearby airport code
          example: CGK
        starRating:
          type: number
          description: Hotel's star. Maximum one decimal place.
          format: double
          example: 4
        lowRate:
          allOf:
          - $ref: '#/components/schemas/CurrencyValue'
          - description: Hotel lowest possible rate.
        highRate:
          allOf:
          - $ref: '#/components/schemas/CurrencyValue'
          - description: Hotel highest possible rate.
        contact:
          allOf:
          - $ref: '#/components/schemas/HotelContact'
          - description: Hotel's contact information
        website:
          type: string
          description: Hotel website
          example: www.traveloka.com
        accommodationType:
          type: string
          description: Hotel's accommodation type
          example: HOTEL
          enum:
          - HOTEL
          - HOSTEL
          - VILLA
          - RESORT
          - ALL_INCLUSIVE
          - APARTMENT
          - BED_AND_BREAKFAST
          - CAMPING
          - BOAT
          - HOMESTAY
          - GUESTHOUSE
          - RYOKAN
          - RIAD
          - POUSADA
          - PRIVATE_VACATION_HOME
          - CAPSULE_HOTEL
          - SERVICE_APARTMENT
          - HOUSE
          - HANOK
          - PENSION
          - CONDOMINIUM
          - HOLIDAY_PARK
          - MOTEL
          - FARM_STAY
          - LODGE
          - TINY_HOUSE
          - BOUTIQUE
          - VACATION_RENTAL
          - INN
          - CABIN
          - CHALET
          - MOBILE_HOME
          - RECREATIONAL_VEHICLE_PARK
          - MONASTERY
          - RANCH
          - GUEST_FARM
          - CASTLE
          - OTHER
        creditCardInfo:
          type: array
          description: Hotel's credit card information
          items:
            $ref: '#/components/schemas/HotelCreditCardInfo'
        providerChainId:
          type: string
          description: Provider Chain ID
          example: '10001'
        providerChainName:
          type: string
          description: Provider Chain Name
          example: TESTCHAIN
        providerBrandId:
          type: string
          description: Provider Brand ID
        providerBrandName:
          type: string
          description: Provider Brand Name
        providerRegionId:
          type: string
          description: 'Hotel Destination Code + “.” + Hotel Zone code.


            Example, if:


            Destination Code: “AAA”


            Zone Code: “1”


            Therefore:


            regionChainId: “AAA.1”

            '
          example: AAA.1
        rateTypes:
          type: array
          description: 'rateType/payment option for the hotel:


            "PAY_NOW" – Customer will make payment upon booking


            "PAY_AT_PROPERTY" – Customer will make payment at Hotel upon arrival

            '
          example:
          - PAY_NOW
          - PAY_AT_PROPERTY
          items:
            type: string
            description: 'rateType/payment option for the hotel:


              "PAY_NOW" – Customer will make payment upon booking


              "PAY_AT_PROPERTY" – Customer will make payment at Hotel upon arrival

              '
            example: '["PAY_NOW","PAY_AT_PROPERTY"]'
            enum:
            - PAY_NOW
            - PAY_AT_PROPERTY
        paymentMethodInfo:
          allOf:
          - $ref: '#/components/schemas/HotelPaymentMethodInfo'
          - description: Payment method that are accepted by the hotel as part of their pay at hotel rate plan. This element
              is mandatory if hotel has 'PAY_AT_PROPERTY' option.
        hotelRateTypes:
          type: array
          description: Rate types offered directly by the hotel (as opposed to the aggregated rateTypes).
          items:
            type: string
            description: Rate types offered directly by the hotel (as opposed to the aggregated rateTypes).
            enum:
            - PAY_NOW
            - PAY_AT_PROPERTY
    RoomContent:
      required:
      - beds
      - description
      - embeddedAssets
      - roomFacility
      - roomId
      - size
      type: object
      properties:
        roomId:
          type: string
          description: "hotel room ID from provider.\n\nNOTE: roomId MUST be unique for every unique physical room type across\
            \ all properties. \nIf roomId is not unique per room type across all properties, this will cause mapping error\
            \ and potential booking dispute.\n\nMaximum character: 100\n"
          example: '10001'
        providerHotelId:
          type: string
        caption:
          type: string
          description: Room caption / room name in English
          example: deluxe room
        description:
          type: string
          description: Room description
          example: DELUXE ROOM
        size:
          allOf:
          - $ref: '#/components/schemas/HotelRoomSize'
          - description: Room Size
        beds:
          allOf:
          - $ref: '#/components/schemas/HotelBeds'
          - description: Hotel Beds
        roomFacility:
          allOf:
          - $ref: '#/components/schemas/HotelRoomFacility'
          - description: Room Facility
        embeddedAssets:
          type: array
          description: This element is for room images. For room images, minimum 4 photos per room, min size 800 x 600 pixels.
          items:
            $ref: '#/components/schemas/HotelRoomAssetEmbedded'
        view:
          type: string
          description: Room views, e.g. "city view"
          example: City view
        smokingPreferences:
          type: string
          description: 'Whether smoking is allowed inside the room. Expected output:


            "S" → Smoking


            "NS" → Non-Smoking


            "E" → Either

            '
          example: S
          enum:
          - S
          - NS
          - E
    ImportHotelDataV2Request:
      type: object
      properties:
        providerHotelIds:
          type: array
          description: Filter for a specific hotel code or list of hotel codes.
          example:
          - '123123'
          - '111111'
          items:
            type: string
            description: Filter for a specific hotel code or list of hotel codes.
            example: '["123123","111111"]'
        locale:
          type: string
          description: 'Locale Code in which the descriptions to be returned.


            If not specifically indicated, English-Indonesian ("en_ID") is the default request.


            Lists of locale supported in Traveloka :


            en_ID


            id_ID


            en_SG


            en_PH


            en_MY


            ms_MY


            en_TH


            th_TH


            en_VN


            vi_VN


            en_AU


            en_EN


            en_JP


            en_KR


            en_HK


            en_TW


            ko_KR


            ja_JP


            zh_EN


            zh_MY


            zh_HK


            zh_TW

            '
          example: en_ID
        lastUpdateTime:
          type: string
          description: 'Specifying this parameter will limit the results to those modified or added after the date specified.

            If the input is empty string, the result will not be restricted by lastUpdateTime (all possible results will be
            returned).

            The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.

            '
          example: '2018-08-01T00:00:00.000Z'
        fields:
          type: array
          description: 'The list of fields to be received in the response.

            If fields is not specified, input is null, or input is empty string, everything will be returned.

            Example to get specific fields:

            fields : { "providerHotelId", "countryISO" }

            '
          items:
            type: string
            description: 'The list of fields to be received in the response.

              If fields is not specified, input is null, or input is empty string, everything will be returned.

              Example to get specific fields:

              fields : { "providerHotelId", "countryISO" }

              '
        countryISOs:
          type: array
          description: Filter for a specific country ISO code or list of country ISO codes.
          example:
          - ID
          items:
            type: string
            description: Filter for a specific country ISO code or list of country ISO codes.
            example: '["ID"]'
        from:
          type: string
          description: Number of the initial record to receive. If nothing is specified (from is null) or input is empty string,
            "1" will be used as default value.
          example: '1'
        to:
          type: string
          description: Number of the last record to receive. If nothing is specified (to is null) or input is empty string,
            "100" will be used as default value.
          example: '100'

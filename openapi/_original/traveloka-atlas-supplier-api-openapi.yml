          - RETAIL
          - MOBILE
          - PRIVATESALE
          - LAST_MINUTE
          - BUDGET_ROOMS
          - PACKAGE
          - CAMPAIGN
          - CROSS_SELL
          - CORPORATE
          - STATIC
          - GROWTH_MARKET
        rooms:
          type: array
          description: List of rooms in the booking
          items:
            $ref: '#/components/schemas/HotelBookingRoomResponse'
    HotelBookingRoomResponse:

                          - Air Conditioning
                          - Mini Bar
                        hotelRoomType: SINGLE
                        view: City view
                        hasTerrace: true
                        smokingPreferences: S
                        embeddedAssets:
                        - assetId: string
                          type: THUMBNAIL
                          isMain: true
                          url: www.image.com/image?no=1
                          caption: Room Image
                          width: 250
                          height: 400
                      inventories:
                      - availabilityToken: ROOM12345
                        rateType: PAY_NOW
                        numRemainingRooms: 5
                        breakfastIncluded: true
                        mealPlan:
                          code: RO
                          pax:
                            adults: 2
                            children: 1
                        wifiIncluded: true
                        numExtraBedIncluded: 0
                        currency: IDR
                        providerRecommendedSellingRate:
                          currency: IDR
                          totalFare: 1000000
                          taxes: 100000
                          fees: 50000
                        providerOriginalRate:
                          currency: IDR
                          totalFare: 1000000
                          taxes: 100000
                          fees: 50000
                        additionalFees:
                          mandatoryFee: {}
                          mandatoryTax: {}
                          resortFee: {}
                          countryTaxFee:
                          - 5
                        numChargedRooms: 2
                        refundable: true
                        cancellationPolicy:
                          cancellationPolicyDescription: string
                          providerCancellationPolicyInfoList:

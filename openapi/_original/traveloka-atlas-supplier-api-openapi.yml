            \ if the issuance process succeed\n\n    CANCELLED → return CANCELLED if the booking is canceled\n\n    FAILED\
            \ → return FAILED if the booking status failed\n\n    PENDING → return PENDING if you are unable to confirm if\
            \ booking is successful/failed within one minute\n"
          enum:
          - NOT_BOOKED
          - BOOKED
          - ISSUED
          - CANCELLED
          - FAILED
          - PENDING

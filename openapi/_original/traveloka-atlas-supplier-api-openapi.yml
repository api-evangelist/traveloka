                          unit: SQUARE_METER
                          description: string
                          sizeIncludingTerrace: true
                        numRooms: 4
                        occupancyPolicy:
                          maxOccupancy: 2
                          maxChildOccupancy: 2
                          maxInfantOccupancy: 1
                          maxExtraBeds: 1
                        beds:
                          numBeds: 2
                          bedType: SINGLE
                          description: Single Beds
                        roomFacility:

    HotelPaymentMethodInfo:
      type: object
      properties:
        creditCardInfo:
          type: array
          description: List of credit card information accepted by the hotel
          items:
            $ref: '#/components/schemas/HotelCreditCardInfo'
        cashCurrencyInfo:
          type: array
          description: List of cash currency information accepted by the hotel
          example:
          - IDR
          - USD
          items:
            type: string
            description: List of cash currency information accepted by the hotel
            example: '["IDR","USD"]'
    HotelProperties:
      required:
      - checkInTime
      - checkOutTime
      type: object
      properties:
        checkInTime:
          type: string
          description: Check-in time in 24-hour format (e.g., '14:00')
          example: '14:00'
        checkOutTime:
          type: string
          description: Check-out time in 24-hour format (e.g., '12:00')
          example: '12:00'
        numRooms:
          type: integer
          description: Number of rooms in the hotel
          format: int32
          example: 100
        numFloors:
          type: integer
          description: Number of floors in the hotel
          format: int32
          example: 10
        numRestaurants:
          type: integer
          description: Number of restaurants in the hotel
          format: int32
          example: 2
        numBars:
          type: integer
          description: Number of bars in the hotel
          format: int32
          example: 1
        roomVoltage:
          type: integer
          description: Room voltage in volts
          format: int32
          example: 220
        roomServiceType:
          type: string
          description: Type of room service available at the hotel
          example: AVAILABLE_24_HOURS
          enum:
          - AVAILABLE_24_HOURS
          - AVAILABLE
          - NOT_AVAILABLE
        parkingType:
          type: string
          description: Type of parking available at the hotel
          example: AVAILABLE
          enum:
          - AVAILABLE
          - NOT_AVAILABLE
        parkingFeeType:
          type: string
          description: Type of parking fee applicable at the hotel
          example: FREE
          enum:
          - FREE
          - CHARGE
        latestCheckInTime:
          type: string

            \ BOOKED if the accommodation allotment for\n            this booking has been reserved and is awaiting payment.\n\
            \   ISSUED → return ISSUED if the issuance process succeed.\n   CANCELLED → return CANCELLED if the booking is\
            \ canceled.\n   UNKNOWN → return UNKNOWN if the booking status failed.\n   PENDING → return PENDING if you are\
            \ unable to confirm\n             if booking is successful/failed within one minute.\n"
          enum:

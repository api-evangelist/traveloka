          type: string
          description: Previous name of the property
          example: Old Sample Hotel
    PropertyPaymentMethodV2:
      type: object
      properties:
        rateTypes:
          type: array
          description: 'Type(s) of supported rates: PAY_NOW, PAY_LATER, PAY_AT_PROPERTY'
          example:
          - PAY_NOW
          - PAY_AT_PROPERTY
          items:
            type: string
            enum:
            - PAY_NOW
            - PAY_LATER
            - PAY_AT_PROPERTY
        acceptedPayment:
          allOf:
          - $ref: '#/components/schemas/AcceptedPaymentV2'
          - description: Accepted payment methods at the property
    PropertyPoliciesV2:
      type: object
      properties:
        importantNotice:
          type: string
          description: Critical general notices for guests
        facilityNotice:
          type: string
          description: Facility-specific notice
        documentPolicy:
          type: string
          description: Required documents for check-in
        depositPolicy:
          type: string
          description: Deposit requirements
        mandatoryFeePolicy:
          type: string
          description: Mandatory fees must be paid to the property in order to check-in
        optionalFeePolicy:
          type: string
          description: Optional/extra fees if customer chose to use the facility/service
        genderPolicy:
          type: string
          description: 'Gender-related policy: FEMALE_ONLY_ACCOMMODATION, GENDER_SEPARATED_FACILITIES, MALE_ONLY_ACCOMMODATION,
            MIXED_GENDER_ACCOMMODATION'
          enum:
          - FEMALE_ONLY_ACCOMMODATION
          - GENDER_SEPARATED_FACILITIES
          - MALE_ONLY_ACCOMMODATION
          - MIXED_GENDER_ACCOMMODATION
        tourismTaxPolicy:
          type: string
          description: Tourism tax details
        extraBreakfastPolicy:
          type: string
          description: Policy for extra breakfast
        breakfastTimePolicy:
          type: string
          description: Time when the breakfast is served
          example: 06:30-10:00
        smokingPolicy:
          type: string
          description: Smoking policy
          example: SMOKING_NOT_ALLOWED
          enum:
          - DESIGNATED_SMOKING_AREA
          - ELECTRONIC_SMOKING_ONLY
          - SMOKING_ALLOWED
          - SMOKING_NOT_ALLOWED

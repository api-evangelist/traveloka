            - DISCOVER
            - MAESTRO
            - DINERS_CLUB
            - CARTA_SI
            - CARTE_BLEUE
            - VISA_ELECTRON
            - CHINA_UNION_PAY
      description: Credit card guarantee requirement for this room
    HotelRoomRateInfo:

        drivingDirections:
          type: string
          description: Driving directions to the hotel
        knowBeforeYouGoDescription:
          type: string
          description: Know before you go description
        locationDescription:
          type: string
          description: Location description
        diningDescription:
          type: string
          description: Dining description
        amenitiesDescription:
          type: string
          description: Amenities description
        businessAmenitiesDescription:
          type: string
          description: Business amenities description
        roomDetailDescription:
          type: string
          description: Room detail description
        importantNotice:
          type: string
          description: 'Important notice. Example: tourism tax, gala dinner, facility notice, temporary events (e.g. disaster,

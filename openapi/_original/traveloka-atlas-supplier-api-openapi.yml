  /hotel-operation-v2:
    post:
      tags:
      - 1.1 Content - Hotel & Room
      summary: Import hotel and room data (v1.1)
      description: 'This operation is for Traveloka to import/get the hotel and room data based on the content data that are
        provided by our partner provider. This is the new protocol and will be the primary integration going forward.<br/><br/>

        **[Please read this before developing Content API v1.1]**<br/>

        Content API v1.1 makes many fields optional compared to v1, but we recommend submitting complete, accurate data wherever
        possible. Our system uses these fields to map your hotels and rooms to our database - missing or incorrect values,
        even in optional fields, can cause mapping to fail. When that happens, the affected hotels or rooms won''t be sellable
        on our platforms.<br/><br/>

        Fewer required fields means more integration flexibility, not less need for data completeness. Partners who submit
        richer content see faster onboarding and fewer mapping errors.<br/><br/>

        See the guide below for details on using Content API v1.1, including which fields matter most for mapping accuracy.<br/>

        [**Content API Completeness Guide for Traveloka''s Suppliers**](https://docs.google.com/document/d/11v0C0MIbz6mTh_BRCjPf4TIGmB2PKb2-5vGwMUxNiuE/edit?usp=sharing)'
      operationId: hotelOperationV2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportHotelDataV2Request'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHotelDataV2Response'
      servers:
      - url: http://localhost:8080
        description: Generated server url

            description: List of fax numbers for the hotel contact. If none exist, just put an empty list
            example: '["+62123456789","+628123456789"]'
        emails:
          type: array
          description: List of email addresses for the hotel contact. If none exist, just put an empty list
          example:
          - hotel@traveloka.com
          - hotel_operation@traveloka.com
          items:
            type: string
            description: List of email addresses for the hotel contact. If none exist, just put an empty list
            example: '["hotel@traveloka.com","hotel_operation@traveloka.com"]'
    IssueResponse:
      required:
      - booking
      - status
      type: object
      properties:
        requestId:
          type: string
          description: Request ID
          example: c2a50648-abb7-45b0-af10-9af4e5bbcfee
        booking:
          allOf:
          - $ref: '#/components/schemas/HotelBookingResponse'
          - description: Booking details
        status:
          type: string
          description: "    Should be one of these:\n\n    OK -> return OK to indicate a successful issue request\n\n    FAILED\
            \ -> return FAILED if there's an error during processing the request\n\n    ALREADY_ISSUED -> return ALREADY_ISSUED\
            \ if the unique ID already issued and the payment has already been processed\n\n    PENDING -> return PENDING\
            \ if you are unable to confirm that the process will be completed within one minute. We will retry the Issue Check\
            \ API call\n\n    PRICE_CHANGED -> return PRICE_CHANGED if there has been a change in the room rate, whether it\
            \ has increased or decreased. We will retry the Issue Check API call\n"
          enum:
          - OK
          - FAILED
          - ALREADY_ISSUED
          - PRICE_CHANGED
          - PENDING
        failureReason:
          type: string
          description: MANDATORY if issueRS status = FAILED.
          deprecated: true
          enum:
          - PROCESS_FAIL
          - CREDIT_CARD_FAIL
          - SOLD_OUT
          - INTERNAL_ERROR
          - INCORRECT_BOOKING_DATA
          - UNKNOWN
        hotelContact:
          $ref: '#/components/schemas/IssueHotelContact'
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
        errors:
          type: array
          description: Mandatory if status = FAILED.
          deprecated: true
          items:
            $ref: '#/components/schemas/ProviderError'
    ProviderError:
      required:
      - errorId
      - errorMessage
      type: object
      properties:
        errorId:
          type: string
          description: "    MANDATORY if has error(s).\n    The values for errorId and the message are:\n    3017 -> BOOKING_ALREADY_ISSUED\n\
            \    3018 -> BOOKING_CANCELED\n    3006 -> BOOKING_EXPIRED\n    3016 -> FAILED_TO_CONFIRM_BOOKING\n    3003 ->\
            \ INCORRECT_BOOKING_ID\n    3001 -> INCORRECT_BOOKING_INFORMATION\n    3020 -> PENDING_BOOKING\n    3000 -> UNEXPECTED_ERROR\n"
        errorSeverity:
          type: string
          description: 'Should be one of these:

            LOW, HIGH, HIGHEST

            '
          enum:
          - LOW
          - HIGH
          - HIGHEST
        errorMessage:
          type: string
          description: "    MANDATORY if has error(s).\n    The values for errorId and the message are:\n    3017 -> BOOKING_ALREADY_ISSUED\n\
            \    3018 -> BOOKING_CANCELED\n    3006 -> BOOKING_EXPIRED\n    3016 -> FAILED_TO_CONFIRM_BOOKING\n    3003 ->\
            \ INCORRECT_BOOKING_ID\n    3001 -> INCORRECT_BOOKING_INFORMATION\n    3020 -> PENDING_BOOKING\n    3000 -> UNEXPECTED_ERROR\n"
        timestamp:
          type: string
          description: Timestamp of the error occurrence in unix milliseconds time format
      deprecated: true
    IssueErrorResponse:
      required:
      - error
      - failureReason
      - status
      type: object
      properties:
        requestId:
          type: string
          description: Request ID
          example: c2a50648-abb7-45b0-af10-9af4e5bbcfee
        status:
          type: string
          description: "    Should be one of these:\n\n    FAILED -> return FAILED if there's an error during processing the\
            \ request\n"
          example: FAILED
          enum:
          - FAILED
        failureReason:
          type: string
          description: MANDATORY if issueRS status = FAILED.
          deprecated: true
          enum:
          - PROCESS_FAIL
          - CREDIT_CARD_FAIL
          - SOLD_OUT
          - INTERNAL_ERROR
          - INCORRECT_BOOKING_DATA
          - UNKNOWN
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
        errors:
          type: array
          description: MANDATORY if the issuance has error(s).
          deprecated: true
          items:
            $ref: '#/components/schemas/ProviderError'
    IssueCheckRequest:
      required:
      - uniqueId
      type: object
      properties:
        uniqueId:
          type: string
          description: Unique Id Traveloka booking ID
          example: 220394113-0
    IssueCheckErrorResponse:
      required:
      - error
      - status
      type: object
      properties:
        requestId:
          type: string
          description: Unique identifier for the booking request
          example: '1234567890'
        status:
          type: string
          description: "    Should be one of these:\n\n    FAILED -> return FAILED if there's an error during processing the\
            \ request\n"
          example: FAILED
          enum:
          - FAILED
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
    IssueCheckBookingResponse:
      required:
      - status
      - uniqueId
      type: object
      properties:
        status:
          type: string
          description: "    Should be one of these:\n    PRICE_CHANGED → return PRICE_CHANGED if price changes between Book\
            \ API and when Issue Check API is called\n    ISSUED → return ISSUED if the request already issued on your side,\
            \ so we can continue to Booking Summary flow\n    FAILED → return FAILED if there's an error during processing\
            \ the request\n    INVALID_UNIQUE_ID → return INVALID_UNIQUE_ID status if the unique ID does not yet exist on\
            \ your side, to facilitate the progression to the next step\n    PENDING → return 'PENDING' if you are unable\
            \ to confirm that the process will be completed within one minute.\n              If 'PENDING' is returned, we\
            \ will not create another issueRQ.\n"
          example: ISSUED
          enum:
          - PRICE_CHANGED
          - ISSUED
          - FAILED
          - INVALID_UNIQUE_ID
          - PENDING
        sourceProvider:
          type: string
          description: Provider name
          example: provider-xyz
        issuanceId:
          type: string
          description: Id to identify this issuance, generated by provider (itinerary ID). This is Mandatory if the status
            is ISSUED
          example: issuance-12345
        uniqueId:
          type: string
          description: Unique Id Traveloka booking ID
          example: 220394113-0
    IssueCheckResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Unique identifier for the booking request
          example: '1234567890'
        status:
          type: string
          description: 'Should be one of these:


            ISSUED → return ISSUED if the request already issued on your side


            FAILED → return FAILED if there''s an error during processing the request


            INVALID_UNIQUE_ID → return INVALID_UNIQUE_ID status if the unique ID does not yet exist on your side, to facilitate
            the progression to the next step


            PENDING → return ''PENDING'' if you are unable to confirm that the process will be completed within one minute.
            If ''PENDING'' is returned, we will not create another issueRQ

            '
          enum:
          - ISSUED
          - FAILED
          - INVALID_UNIQUE_ID
          - PENDING
        error:
          allOf:
          - $ref: '#/components/schemas/Error'
          - description: For complete error enums, please check on FAQ > Error Object
        booking:
          allOf:
          - $ref: '#/components/schemas/IssueCheckBookingResponse'
          - description: Booking information
    ImportHotelDataRequest:
      type: object
      properties:
        fields:
          type: array
          description: "    The list of fields to be received in the response.\n    If fields is not specified, input is null,\
            \ or input is empty string, everything will be returned.\n    Example to get specific fields:\n    fields : {\
            \ \"providerHotelId\", \"countryISO\" }\n"
          items:
            type: string
            description: "    The list of fields to be received in the response.\n    If fields is not specified, input is\
              \ null, or input is empty string, everything will be returned.\n    Example to get specific fields:\n    fields\
              \ : { \"providerHotelId\", \"countryISO\" }\n"
        providerHotelIds:
          type: array
          description: Filter for a specific hotel code or list of hotel codes.
          example:
          - '123123'
          - '111111'
          items:
            type: string
            description: Filter for a specific hotel code or list of hotel codes.
            example: '["123123","111111"]'
        countryISOs:
          type: array
          description: Filter for a specific country ISO code or list of country ISO codes.
          example:
          - ID
          items:
            type: string
            description: Filter for a specific country ISO code or list of country ISO codes.
            example: '["ID"]'
        lastUpdateTime:
          type: string
          description: "    Specifying this parameter will limit the results to those modified or added after the date specified.\n\
            \    If the input is empty string, the result will not be restricted by lastUpdateTime (all possible results will\
            \ be returned).\n    The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.\n"
          example: '2018-08-01T00:00:00.000Z'
        locale:
          type: string
          description: 'Locale Code in which the descriptions to be returned.


            If not specifically indicated, English-Indonesian ("en_ID") is the default request.


            Lists of locale supported in Traveloka :


            en_ID


            id_ID


            en_SG


            en_PH


            en_MY


            ms_MY


            en_TH


            th_TH


            en_VN


            vi_VN


            en_AU


            en_EN


            en_JP


            en_KR


            en_HK


            en_TW


            ko_KR


            ja_JP


            zh_EN


            zh_MY


            zh_HK


            zh_TW


            '
          example: en_ID
        from:
          type: string
          description: Number of the initial record to receive. If nothing is specified (from is null) or input is empty string,
            "1" will be used as default value.
          example: '1'
        to:
          type: string
          description: Number of the last record to receive. If nothing is specified (to is null) or input is empty string,
            "100" will be used as default value.
          example: '100'
    CurrencyValue:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: integer
          format: int64
    HotelAddress:
      required:
      - city
      - lines
      - postalCode
      type: object
      properties:
        lines:
          type: array
          description: "    Hotel address details, must be in English.\n    Input can be in multiple lines.\n    For example:\n\
            \    \"lines\" : [\n      \"7 Robinshon Road\",\n      \"Singapore\"\n    ]\n"
          items:
            type: string
            description: "    Hotel address details, must be in English.\n    Input can be in multiple lines.\n    For example:\n\
              \    \"lines\" : [\n      \"7 Robinshon Road\",\n      \"Singapore\"\n    ]\n"
        city:
          type: string
          description: City of the hotel address
        province:
          type: string
          description: Province of the hotel address
        postalCode:
          type: string
          description: Postal code of the hotel address
        country:
          type: string
          description: Country of the hotel address
    HotelAsset:
      required:
      - caption
      - height
      - id
      - isMain
      - url
      - width
      type: object
      properties:
        id:
          type: string
          description: Asset ID. This ID should be unique for all assets that provider sent.
          example: '10004'
        providerHotelId:
          type: string
        type:
          type: string
          enum:
          - THUMBNAIL
          - SMALL_PHOTO
          - FULL_LANDSCAPE_PHOTO
          - HIGH_RESOLUTION_PHOTO
        category:
          type: string
          description: Asset category type. This is used to categorize the asset, such as 'room', 'amenity', 'exterior', etc.
          example: ROOM
          enum:
          - EXTERIOR_BUILDING
          - LOBBY
          - SWIMMING_POOL
          - ENTERTAINMENT_FACILITY
          - SPORT_FACILITY
          - HYGIENE_FACILITY
          - BEDROOM
          - BATHROOM
          - FUNCTIONAL_HALL
          - RESTAURANT
          - BAR_CAFE_LOUNGE
          - VIEW_ATTRACTIONS
          - HOTEL_SERVICES
          - COMMON_SPACE
          - BALCONY_TERRACE
          - BALLROOM
          - SHOWER
          - PRIVATE_POOL
          - OTHERS
        isMain:
          type: boolean
          description: Indicates if this asset is the main asset for the hotel.
          example: true
        watermarked:
          type: boolean
        url:
          type: string
          description: URL of the asset. This should be a valid URL pointing to the asset location.
          example: https://example.com/assets/10004.jpg
        caption:
          type: string
          description: Caption for the asset. This is a short description or title for the asset.
          example: Deluxe Room with Sea View
        width:
          type: integer
          description: Image width, min 800 x 600 pixels
          format: int32
        height:
          type: integer
          description: Image height, min 800 x 600 pixels
          format: int32
          example: 600
        isActive:
          type: boolean
          description: To indicate the validity of asset / whether it has been removed.
          example: true

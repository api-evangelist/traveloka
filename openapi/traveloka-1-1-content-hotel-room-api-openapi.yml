          allOf:
          - $ref: '#/components/schemas/AcceptedPaymentV2'
          - description: Accepted payment methods at the property
    ProviderHotel:
      required:
      - accommodationType
      - countryISO
      - displayName
      - globalAddress
      - hotelFacility
      - hotelProperties
      - latitude
      - localAddress
      - longitude
      - name
      - providerHotelId
      - rateTypes
      - starRating
      type: object
      properties:
        providerHotelId:
          type: string
          description: Hotel Code from Provider
          example: '10000001'
        displayName:
          type: string
          description: Hotel Name to be displayed. This name is depending on locale/languages
          example: Hotel ABC
        name:
          type: string
          description: Official Hotel Name in English. This name must be consistent and NOT affected by locales/languages
          example: Hotel ABC
        formerlyName:
          type: string
          description: Old Hotel Name (if applicable)
          example: Hotel ABC
        localAddress:
          allOf:
          - $ref: '#/components/schemas/HotelAddress'
          - description: Hotel local address
        globalAddress:
          allOf:
          - $ref: '#/components/schemas/HotelAddress'
          - description: Hotel global address
        countryISO:
          type: string
          description: Hotel country ISO code
          example: ID
        hotelStyle:
          $ref: '#/components/schemas/HotelStyle'
        hotelFacility:
          allOf:
          - $ref: '#/components/schemas/HotelFacility'
          - description: Hotel facility
        hotelProperties:
          allOf:
          - $ref: '#/components/schemas/HotelProperties'
          - description: Hotel properties
        latitude:
          type: number
          description: Hotel's latitude position
          format: double
          example: 18.7123
        longitude:
          type: number
          description: Hotel's longitude position
          format: double
          example: 99.00713
        nearbyAirportCode:
          type: string
          description: Hotel's nearby airport code
          example: CGK
        starRating:
          type: number
          description: Hotel's star. Maximum one decimal place.
          format: double
          example: 4
        lowRate:
          allOf:
          - $ref: '#/components/schemas/CurrencyValue'
          - description: Hotel lowest possible rate.
        highRate:
          allOf:
          - $ref: '#/components/schemas/CurrencyValue'
          - description: Hotel highest possible rate.
        contact:
          allOf:
          - $ref: '#/components/schemas/HotelContact'
          - description: Hotel's contact information
        website:
          type: string
          description: Hotel website
          example: www.traveloka.com
        accommodationType:
          type: string
          description: Hotel's accommodation type
          example: HOTEL
          enum:
          - HOTEL
          - HOSTEL
          - VILLA
          - RESORT
          - ALL_INCLUSIVE
          - APARTMENT
          - BED_AND_BREAKFAST
          - CAMPING
          - BOAT
          - HOMESTAY
          - GUESTHOUSE
          - RYOKAN
          - RIAD
          - POUSADA
          - PRIVATE_VACATION_HOME
          - CAPSULE_HOTEL
          - SERVICE_APARTMENT
          - HOUSE
          - HANOK
          - PENSION
          - CONDOMINIUM
          - HOLIDAY_PARK
          - MOTEL
          - FARM_STAY
          - LODGE
          - TINY_HOUSE
          - BOUTIQUE
          - VACATION_RENTAL
          - INN
          - CABIN
          - CHALET
          - MOBILE_HOME
          - RECREATIONAL_VEHICLE_PARK
          - MONASTERY
          - RANCH
          - GUEST_FARM
          - CASTLE
          - OTHER
        creditCardInfo:
          type: array
          description: Hotel's credit card information
          items:
            $ref: '#/components/schemas/HotelCreditCardInfo'
        providerChainId:
          type: string
          description: Provider Chain ID
          example: '10001'
        providerChainName:
          type: string
          description: Provider Chain Name
          example: TESTCHAIN
        providerBrandId:
          type: string
          description: Provider Brand ID
        providerBrandName:
          type: string
          description: Provider Brand Name
        providerRegionId:
          type: string
          description: 'Hotel Destination Code + “.” + Hotel Zone code.


            Example, if:


            Destination Code: “AAA”


            Zone Code: “1”


            Therefore:


            regionChainId: “AAA.1”

            '
          example: AAA.1
        rateTypes:
          type: array
          description: 'rateType/payment option for the hotel:


            "PAY_NOW" – Customer will make payment upon booking


            "PAY_AT_PROPERTY" – Customer will make payment at Hotel upon arrival

            '
          example:
          - PAY_NOW
          - PAY_AT_PROPERTY
          items:
            type: string
            description: 'rateType/payment option for the hotel:


              "PAY_NOW" – Customer will make payment upon booking


              "PAY_AT_PROPERTY" – Customer will make payment at Hotel upon arrival

              '
            example: '["PAY_NOW","PAY_AT_PROPERTY"]'
            enum:
            - PAY_NOW
            - PAY_AT_PROPERTY
        paymentMethodInfo:
          allOf:
          - $ref: '#/components/schemas/HotelPaymentMethodInfo'
          - description: Payment method that are accepted by the hotel as part of their pay at hotel rate plan. This element is mandatory if hotel has 'PAY_AT_PROPERTY' option.
        hotelRateTypes:
          type: array
          description: Rate types offered directly by the hotel (as opposed to the aggregated rateTypes).
          items:
            type: string
            description: Rate types offered directly by the hotel (as opposed to the aggregated rateTypes).
            enum:
            - PAY_NOW
            - PAY_AT_PROPERTY

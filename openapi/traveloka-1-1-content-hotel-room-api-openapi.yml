    HotelRoomAssetEmbedded:
      required:
      - assetId
      - height
      - url
      - width
      type: object
      properties:
        assetId:
          type: string
          description: Unique identifier for the hotel room asset
          example: asset123
        isMain:
          type: boolean
          description: Indicates if this asset is the main asset for the hotel room
          example: true
        url:
          type: string
          description: URL of the hotel room asset
          example: www.image.com/image?no=1
        caption:
          type: string
          description: Caption of the hotel room asset
          example: Room Image
        width:
          type: integer
          description: Image width
          format: int32
          example: 250
        height:
          type: integer
          description: Image height
          format: int32
          example: 400
    HotelProperties:
      required:
      - checkInTime
      - checkOutTime
      type: object
      properties:
        checkInTime:
          type: string
          description: Check-in time in 24-hour format (e.g., '14:00')
          example: '14:00'
        checkOutTime:
          type: string
          description: Check-out time in 24-hour format (e.g., '12:00')
          example: '12:00'
        numRooms:
          type: integer
          description: Number of rooms in the hotel
          format: int32
          example: 100
        numFloors:
          type: integer
          description: Number of floors in the hotel
          format: int32
          example: 10
        numRestaurants:
          type: integer
          description: Number of restaurants in the hotel
          format: int32
          example: 2
        numBars:
          type: integer
          description: Number of bars in the hotel
          format: int32
          example: 1
        roomVoltage:
          type: integer
          description: Room voltage in volts
          format: int32
          example: 220
        roomServiceType:
          type: string
          description: Type of room service available at the hotel
          example: AVAILABLE_24_HOURS
          enum:
          - AVAILABLE_24_HOURS
          - AVAILABLE
          - NOT_AVAILABLE
        parkingType:
          type: string
          description: Type of parking available at the hotel
          example: AVAILABLE
          enum:
          - AVAILABLE
          - NOT_AVAILABLE
        parkingFeeType:
          type: string
          description: Type of parking fee applicable at the hotel
          example: FREE
          enum:
          - FREE
          - CHARGE
        latestCheckInTime:
          type: string
          description: Latest possible check-in time in 24-hour format (e.g., '23:00')
          example: '23:00'
        earliestCheckOutTime:
          type: string
          description: Earliest possible check-out time in 24-hour format (e.g., '06:00')
          example: 06:00
        isAvailableAirportTransfer:
          type: boolean
          description: Indicates if airport transfer is available
          example: true
        airportTransferFee:
          type: integer
          description: Fee for airport transfer in the local currency
          format: int64
          example: 50000
        timeToAirport:
          type: integer
          description: Time to the nearest airport in minutes
          format: int32
          example: 30
        breakfastCharge:
          type: integer
          description: Price for breakfast
          format: int64
          example: 20000
        distanceToCityCenter:
          type: integer
          description: Distance to the city center in meters
          format: int32
          example: 5000
        builtYear:
          type: integer
          description: Year the hotel was built
          format: int32
          example: 1990
        lastRenovatedYear:
          type: integer
          description: Year the hotel was last renovated
          format: int32
          example: 2015

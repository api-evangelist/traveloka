    HotelAsset:
      required:
      - caption
      - height
      - id
      - isMain
      - url
      - width
      type: object
      properties:
        id:
          type: string
          description: Asset ID. This ID should be unique for all assets that provider sent.
          example: '10004'
        providerHotelId:
          type: string
        type:
          type: string
          enum:
          - THUMBNAIL
          - SMALL_PHOTO
          - FULL_LANDSCAPE_PHOTO
          - HIGH_RESOLUTION_PHOTO
        category:
          type: string
          description: Asset category type. This is used to categorize the asset, such as 'room', 'amenity', 'exterior', etc.
          example: ROOM
          enum:
          - EXTERIOR_BUILDING
          - LOBBY
          - SWIMMING_POOL
          - ENTERTAINMENT_FACILITY
          - SPORT_FACILITY
          - HYGIENE_FACILITY
          - BEDROOM
          - BATHROOM
          - FUNCTIONAL_HALL
          - RESTAURANT
          - BAR_CAFE_LOUNGE
          - VIEW_ATTRACTIONS
          - HOTEL_SERVICES
          - COMMON_SPACE
          - BALCONY_TERRACE
          - BALLROOM
          - SHOWER
          - PRIVATE_POOL
          - OTHERS
        isMain:
          type: boolean
          description: Indicates if this asset is the main asset for the hotel.
          example: true
        watermarked:
          type: boolean
        url:
          type: string
          description: URL of the asset. This should be a valid URL pointing to the asset location.
          example: https://example.com/assets/10004.jpg
        caption:
          type: string
          description: Caption for the asset. This is a short description or title for the asset.
          example: Deluxe Room with Sea View
        width:
          type: integer
          description: Image width, min 800 x 600 pixels
          format: int32
        height:
          type: integer
          description: Image height, min 800 x 600 pixels
          format: int32
          example: 600
        isActive:
          type: boolean
          description: To indicate the validity of asset / whether it has been removed.
          example: true
    PropertyReviewV2:
      type: object
      properties:
        averageScore:
          type: number
          description: Average review score from provider or aggregated source
          format: double
          example: 8.5
        numReviews:
          type: integer
          description: Total number of reviews counted for the score
          format: int32
          example: 1250
    ImportHotelDataResponse:
      required:
      - hotels
      type: object
      properties:
        from:
          type: integer
          description: Initial record number being retrieved.
          format: int32
          example: 1
        to:
          type: integer
          description: Final record number being retrieved.
          format: int32
          example: 100
        total:
          type: integer
          description: Total number of records available.
          format: int32
          example: 1000
        hotels:
          type: array
          description: List of hotel content data
          items:
            $ref: '#/components/schemas/HotelContent'
        errors:
          type: array
          description: List of errors encountered during data retrieval. Each error corresponds to a hotel that could not be retrieved.
          items:
            $ref: '#/components/schemas/ProviderErrorV2'
    ImportHotelDataV2Response:
      required:
      - hotels
      type: object
      properties:
        hotels:
          type: array
          description: List of hotel data in ACDCIS 2.0 format. Each item contains a property object and its rooms.
          items:
            $ref: '#/components/schemas/HotelDataV2'
        errors:
          type: array
          description: List of errors encountered during data retrieval. Each error corresponds to a hotel that could not be retrieved.
          items:
            $ref: '#/components/schemas/ProviderErrorV2'

          format: double
          example: 10
    PropertyContactV2:
      type: object
      properties:
        contactType:
          type: string
          description: 'Type of contact (valid values: FRONT_DESK, FRONT_OFFICE_MANAGER, RESERVATIONS)'
          example: FRONT_DESK
          enum:
          - FRONT_DESK
          - FRONT_OFFICE_MANAGER
          - RESERVATIONS
        phones:
          type: array
          description: Phone numbers for this contact
          items:
            $ref: '#/components/schemas/PhoneContactV2'

          type: array
          description: Email addresses for this contact
          example:
          - info@hotel.com
          items:
            type: string
            description: Email addresses for this contact
            example: '["info@hotel.com"]'
    PropertyPaymentMethodV2:
      type: object
      properties:
        rateTypes:
          type: array
          description: 'Type(s) of supported rates: PAY_NOW, PAY_LATER, PAY_AT_PROPERTY'
          example:
          - PAY_NOW
          - PAY_AT_PROPERTY
          items:
            type: string
            enum:
            - PAY_NOW
            - PAY_LATER
            - PAY_AT_PROPERTY

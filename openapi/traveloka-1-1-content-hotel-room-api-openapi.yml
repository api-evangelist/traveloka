    ImportHotelDataV2Request:
      type: object
      properties:
        providerHotelIds:
          type: array
          description: Filter for a specific hotel code or list of hotel codes.
          example:
          - '123123'
          - '111111'
          items:
            type: string
            description: Filter for a specific hotel code or list of hotel codes.
            example: '["123123","111111"]'
        locale:
          type: string
          description: 'Locale Code in which the descriptions to be returned.


            If not specifically indicated, English-Indonesian ("en_ID") is the default request.


            Lists of locale supported in Traveloka :


            en_ID


            id_ID


            en_SG


            en_PH


            en_MY


            ms_MY


            en_TH


            th_TH


            en_VN


            vi_VN


            en_AU


            en_EN


            en_JP


            en_KR


            en_HK


            en_TW


            ko_KR


            ja_JP


            zh_EN


            zh_MY


            zh_HK


            zh_TW

            '
          example: en_ID
        lastUpdateTime:
          type: string
          description: 'Specifying this parameter will limit the results to those modified or added after the date specified.

            If the input is empty string, the result will not be restricted by lastUpdateTime (all possible results will be returned).

            The allowed format is YYYY-MM-DDThh:mm:ss.nnnZ.

            '
          example: '2018-08-01T00:00:00.000Z'
        fields:
          type: array
          description: 'The list of fields to be received in the response.

            If fields is not specified, input is null, or input is empty string, everything will be returned.

            Example to get specific fields:

            fields : { "providerHotelId", "countryISO" }

            '
          items:
            type: string
            description: 'The list of fields to be received in the response.

              If fields is not specified, input is null, or input is empty string, everything will be returned.

              Example to get specific fields:

              fields : { "providerHotelId", "countryISO" }

              '
        countryISOs:
          type: array
          description: Filter for a specific country ISO code or list of country ISO codes.
          example:
          - ID
          items:
            type: string
            description: Filter for a specific country ISO code or list of country ISO codes.
            example: '["ID"]'
        from:
          type: string
          description: Number of the initial record to receive. If nothing is specified (from is null) or input is empty string, "1" will be used as default value.
          example: '1'
        to:
          type: string
          description: Number of the last record to receive. If nothing is specified (to is null) or input is empty string, "100" will be used as default value.
          example: '100'
    HotelContent:
      required:
      - assets
      - attribute
      - hotel
      type: object
      properties:
        hotel:
          allOf:
          - $ref: '#/components/schemas/ProviderHotel'
          - description: Hotel information provided by the provider
        attribute:
          allOf:
          - $ref: '#/components/schemas/HotelAttribute'
          - description: 'Additional hotel attribute and instruction,

              the fields are not mandatory except hotel code,

              hotel description and hotel overview.

              Provide other details if deemed necessary.

              '
        assets:
          type: array
          description: List of hotel assets provided by the provider. Minimum 25 hotel photos, from 5 categories.
          items:
            $ref: '#/components/schemas/HotelAsset'
        rooms:
          type: array
          description: List of Hotel Rooms (Mandatory for Room Import)
          items:
            $ref: '#/components/schemas/RoomContent'
    HotelCreditCardInfo:
      type: object
      properties:
        creditCardType:
          type: string
          description: Credit card type that is accepted as payment method in hotel
          enum:
          - VISA
          - AMERICAN_EXPRESS
          - BC_CARD
          - MASTERCARD
          - DISCOVER
          - DINERS_CLUB
          - CARTA_SI
          - CARTE_BLEUE
          - VISA_ELECTRON
          - JAPAN_CREDIT_BUREAU
          - MAESTRO
          - CHINA_UNION_PAY
          - UNION_PAY
        creditCardName:
          type: string
          description: Credit card name that is accepted as payment method in hotel
        mandatoryDisplayText:
          type: string
          description: Mandatory display text for credit card information, e.g. 'Credit card holder name must match the name on the reservation'

summary: >-
  Traveloka publishes NO client SDK for any of its three partner API programs. Partners integrate by
  hand against the REST/OTA-XML contracts. Traveloka does maintain a set of first-party open-source npm
  packages under the @traveloka scope, but they are front-end engineering tooling (React form/schema
  libraries, lint configs, React Native components) - not API clients. No SDKs pointer is wired into
  apis.yml because no API client library exists to point at.

